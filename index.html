<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExtrAds</title>
    
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            height: 100%;
            background-color: #040d06; /* Fundo limpo e escuro */
            color: #fff;
            overflow: hidden; /* Esconde rolagem no PC para tela cheia */
        }

        /* --- CONTAINER PRINCIPAL (FLEXBOX) --- */
        .container {
            display: flex;
            flex-direction: row;
            height: 100vh;
            width: 100%;
            position: relative;
        }

        /* --- LOGO CENTRAL --- */
        .center-logo {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none; 
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .center-logo img {
            height: 220px; /* Logo maior no PC */
            width: auto;
            object-fit: contain;
            transition: all 0.4s ease;
            pointer-events: auto; /* Permite hover na logo */
            cursor: pointer;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .center-logo:hover img {
            animation: pulse 0.8s ease-in-out infinite;
        }

        /* --- SEÇÕES (SIDES) --- */
        .side {
            flex: 1; /* Divide as 3 seções igualmente */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 180px 40px 40px; /* Espaço extra no topo para a logo maior não cobrir o texto */
            color: #fff;
            background-color: transparent;
            transition: flex 0.6s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.4s;
            position: relative;
            text-align: center;
        }

        /* Efeito sanfona no PC: Encolhe quem não tem hover, expande quem tem */
        @media (min-width: 769px) {
            .container:hover .side {
                flex: 0.8; 
            }
            .container .side:hover {
                flex: 1.4;
                background-color: rgba(43, 179, 75, 0.03); /* Brilho verde muito sutil no fundo ao focar */
            }
        }

        .side h2 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #e6f7eb;
            transition: transform 0.4s ease, color 0.4s ease;
            font-family: 'Poppins', sans-serif;
        }

        .side p {
            font-size: 1.1rem;
            max-width: 400px;
            opacity: 0.75;
            margin-bottom: 25px;
            line-height: 1.6;
            color: #b3d9bc;
        }

        .side:hover h2 {
            transform: scale(1.05);
            color: #4ade80;
        }

        /* --- BOTÕES --- */
        .btn {
            display: inline-block;
            text-decoration: none;
            padding: 12px 35px;
            border: 2px solid #2bb34b;
            border-radius: 30px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            background: transparent;
            color: #2bb34b;
            transition: all 0.4s ease;
            cursor: pointer;
            margin-bottom: 30px;
        }

        .btn:hover {
            background: #2bb34b;
            color: #040d06;
            box-shadow: 0 0 20px rgba(43, 179, 75, 0.6);
            border-color: #2bb34b;
        }

        /* Contêiner para os ícones sociais dentro das seções */
        .social-inline {
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
        }

        .card-round {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(4, 13, 6, 0.6);
            border: 2px solid rgba(43, 179, 75, 0.4);
            backdrop-filter: blur(8px);
            transition: all 0.4s ease;
            text-decoration: none;
            padding: 12px;
        }

        .card-round img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: all 0.4s ease;
        }

        .card-round:hover {
            transform: translateY(-5px);
            border-color: #4ade80;
            box-shadow: 0 0 15px rgba(74, 222, 128, 0.5);
            background: rgba(4, 13, 6, 0.9);
        }

        /* --- BOTAO FLUTUANTE (GITHUB) --- */
        .flutuante-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .flutuante-btn {
            width: 50px;
            height: 50px;
            background: rgba(4, 13, 6, 0.8);
            border: 2px solid #2bb34b;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            padding: 10px;
        }

        .flutuante-btn img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .flutuante-btn:hover {
            transform: scale(1.1) rotate(8deg);
            border-color: #4ade80;
            box-shadow: 0 0 20px rgba(43, 179, 75, 0.6);
            background: #040d06;
        }

        /* --- RESPONSIVIDADE (CELULAR) --- */
        @media (max-width: 768px) {
            body, html {
                overflow: auto; /* Permite rolar a tela no celular */
            }
            .container {
                flex-direction: column; /* Empilha as 3 seções */
                height: auto;
                min-height: 100vh;
            }
            .side {
                padding: 130px 20px 60px; /* Aumentado para acomodar a logo maior no mobile */
                min-height: 50vh;
            }
            .side h2 {
                font-size: 2rem;
            }
            .center-logo {
                position: fixed; /* Mantém a logo visível ao rolar */
                top: 15px;
                background: rgba(4, 13, 6, 0.85); /* Leve fundo para leitura */
                padding: 15px 30px;
                border-radius: 30px;
                border: 1px solid rgba(43, 179, 75, 0.3);
                backdrop-filter: blur(8px);
            }
            .center-logo img {
                height: 70px; /* Logo BEM maior no celular */
            }
            .flutuante-container {
                bottom: 15px;
                right: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="center-logo">
        <!-- Coloque a URL da sua logo no src -->
        <img src="Logo-ExtrAds-removebg.png" alt="Logo ExtrAds">
    </div>

    <div class="container">
        
        <!-- SEÇÃO 1: ECOMMERCES -->
        <div class="side">
            <h2>eCommercers</h2>
            <p>Explore nossas lojas virtuais. Produtos exclusivos, ofertas especiais e entrega rápida direto na sua casa.</p>
            <a href="#" class="btn">Em Breve</a>
        </div>

        <!-- SEÇÃO 2: HUBS -->
        <div class="side">
            <h2>Hubs</h2>
            <p>Saiba onde estão nossos centros comerciais para pessoas e empresas no mapa.</p>
            <a href="#" class="btn">Em Breve</a>
        </div>

        <!-- SEÇÃO 3: BLOGS -->
        <div class="side">
            <h2>Blogs</h2>
            <p>Conectando você às melhores novidades, produtos e marcas!</p>
             
            <!-- Agrupei os botões das redes sociais para ficarem lado a lado -->
            <div class="social-inline">
                <!-- TikTok -->
                <a href="https://www.tiktok.com/@extrads.oficial" class="card-round" title="Tiktok" target="_blank">
                    <img src="https://images.seeklogo.com/logo-png/34/2/tiktok-logo-png_seeklogo-340606.png" alt="TikTok Logo">
                </a>

                <!-- Instagram -->
                <a href="https://www.instagram.com/extrads.oficial/" class="card-round" title="Instagram" target="_blank">
                    <img src="https://www.pngall.com/wp-content/uploads/13/Instagram-Logo.png" alt="Instagram Logo">
                </a>
            </div>
        </div>

    </div>

    <!-- BOTÃO FLUTUANTE GLOBAL -->
    <div class="flutuante-container">
        <!-- GitHub -->
        <a href="https://github.com/ExtrAds/ExtrAds" class="flutuante-btn" title="GitHub" target="_blank">
            <img src="https://uxwing.com/wp-content/themes/uxwing/download/brands-and-social-media/github-white-icon.png" alt="GitHub Logo">
        </a>
    </div>

</body>
</html>
